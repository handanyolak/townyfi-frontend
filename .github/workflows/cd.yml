name: cd

on:
  push:
    branches:
      - main
      - master
      - bingo
  pull_request:
    branches:
      - main
      - master
      - bingo
  workflow_dispatch:

env:
  NUXT_APP_ENV: ${{ secrets.NUXT_APP_ENV }}
  NUXT_APP_BASE_URL: ${{ secrets.NUXT_APP_BASE_URL }}
  NUXT_DRAWN_NUMBERS_ADDITIONAL_TIME_IN_SEC: ${{ secrets.NUXT_DRAWN_NUMBERS_ADDITIONAL_TIME_IN_SEC }}
  NUXT_DRAWN_NUMBERS_INTERVAL_IN_SEC: ${{ secrets.NUXT_DRAWN_NUMBERS_INTERVAL_IN_SEC }}
  NUXT_APP_URL: ${{ secrets.NUXT_APP_URL }}
  NUXT_CHAIN_BLOCK_TIME_IN_SEC: ${{ secrets.NUXT_CHAIN_BLOCK_TIME_IN_SEC }}
  NUXT_CHAIN: ${{ secrets.NUXT_CHAIN }}
  NUXT_CHAIN_EXTEND_EXPLORER_URLS: ${{ secrets.NUXT_CHAIN_EXTEND_EXPLORER_URLS }}
  NUXT_BINGO_CONTRACT_ADDRESS: ${{ secrets.NUXT_BINGO_CONTRACT_ADDRESS }}
  NUXT_RPC_URLS: ${{ secrets.NUXT_RPC_URLS }}
  NUXT_RPC_URLS_PUBLIC: ${{ secrets.NUXT_RPC_URLS_PUBLIC }}
  NUXT_RPC_WS_URLS: ${{ secrets.NUXT_RPC_WS_URLS }}
  NUXT_OZ_DEFENDER_RELAYER_WEBHOOK_URL: ${{ secrets.NUXT_OZ_DEFENDER_RELAYER_WEBHOOK_URL }}
  NUXT_OZ_DEFENDER_RELAYER_MESSAGE: ${{ secrets.NUXT_OZ_DEFENDER_RELAYER_MESSAGE }}
  NUXT_REOWN_APPKIT_PROJECT_ID: ${{ secrets.NUXT_REOWN_APPKIT_PROJECT_ID }}

jobs:
  cd:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04]
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files-specific
        uses: tj-actions/changed-files@v35
        with:
          files: |
            src
            nuxt.config.ts
            package.json
            yarn.lock

      - name: List all changed files
        run: |
          for file in ${{ steps.changed-files-specific.outputs.all_changed_files }}; do
            echo "$file was changed"
          done

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies with dev deps
        run: yarn install --production=false

      - name: Build
        run: yarn generate

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.output/public
          publish_branch: gh-pages
